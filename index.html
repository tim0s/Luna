<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    #map { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const CONFIG = {
      objLat:           47.349540,
      objLon:            8.491359,
      objH:                    70,   // object height (m)
      objElev:                  0,   // filled in by JS after terrain loads
      startISO: "2026-05-01T00:00:00Z",
      endISO:   "2026-05-31T23:00:00Z",
      stepH:                  0.5,
      minAltDeg:                2,
      minDistM:              1500,
      maxSunAltDeg:             0,
      minMoonIllumPct:         30,
      shadowStepM:            100,
      mapHalfKm:                5,
    };
    const MAP_VAR = 'map';

    const _R = 6371000;
    const _dlat = CONFIG.mapHalfKm * 1000 / _R * 180 / Math.PI;
    const _dlon = CONFIG.mapHalfKm * 1000 / (_R * Math.cos(CONFIG.objLat * Math.PI / 180)) * 180 / Math.PI;
    var map = L.map('map').fitBounds([
      [CONFIG.objLat - _dlat, CONFIG.objLon - _dlon],
      [CONFIG.objLat + _dlat, CONFIG.objLon + _dlon],
    ], {padding: [40, 40]});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20,
    }).addTo(map);
  </script>
  <script src="moon_shadow.js"></script>
</body>
</html>
